# full form
# mctl add --id monorepo-vscode --origin git@github.com:mirrorboards/mirrorboards-vscode.git --path ./.vscode --tag monorepo

# short form
# mctl add [origin] [path]
# mctl add git@github.com:mirrorboards/mirrorboards-vscode.git ./.vscode --tag monorepo --id monorepo-vscode --branch main

[[repositories]]
# default: short generated id
id = "monorepo-vscode"

# required
origin = "git@github.com:mirrorboards/mirrorboards-vscode.git"

# default: main
branch = "main"

# default: path exctracted from git repositor (in this example got overrided by flag --path ./.vscode)
path = "./mirrorboards/.vscode"

# default: false
lock = false

# default: empty
tags = ["monorepo"]


### utils ###
[[repositories]]
id = "vscode-config"
origin = "git@github.com:mirrorboards/mirrorboards-vscode.git"
path = ".vscode"
branch = "main"
path = "./mirrorboards/.vscode"
lock = false
tags = ["monorepo"]

