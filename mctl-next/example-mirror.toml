# Example mirror.toml configuration file
# Demonstrates all features of mctl-next

# Import other configuration files
include = [
  # "./team-a-repos.toml",
  # "./team-b-repos.toml"
]

# Central config repository for config save and snapshots
[config-repo]
git = "git@github.com:mirrorboards/mirror.git"
branch = "main"
config_path = "mirror.toml"
snapshots_dir = "snapshots"

# Repository definitions
[[repositories]]
git = "git@github.com:mirrorboards-rs/dfns-core.git"
path = "crates/dfns-core"
branch = "main"
workspaces = ["actaboards", "api"]

[[repositories]]
git = "git@github.com:mirrorboards-rs/bitshares-client.git"
path = "crates/bitshares-client"
branch = "main"
workspaces = ["actaboards"]

[[repositories]]
git = "git@github.com:mirrorboards-rs/acta-sdk.git"
path = "libs/acta-sdk"
tag = "v1.0.0"
workspaces = ["api"]

[[repositories]]
git = "git@github.com:mirrorboards/shared-types.git"
path = "libs/shared-types"
# branch = "main" is the default
workspaces = ["actaboards", "api"]
