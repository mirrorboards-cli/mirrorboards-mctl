[workspace]
resolver = "2"
members = ["mctl", "mirror-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mirrorboards Team"]
license = "MIT"
repository = "https://github.com/mirrorboards/mctl-next"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Git operations
git2 = "0.19"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Output formatting
colored = "2"
indicatif = "0.17"
tabled = "0.17"

# Internal
mirror-sdk = { path = "mirror-sdk" }
