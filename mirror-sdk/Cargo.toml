[package]
name = "mirror-sdk"
version = "0.1.0"
edition = "2021"
description = "A Rust SDK for managing mirror.toml configuration files"
authors = ["MirrorBoards Team"]
license = "MIT"
repository = "https://github.com/mirrorboards/mirror-sdk"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
path-absolutize = "3.1"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "repository_management"
path = "examples/repository_management.rs"

[[example]]
name = "config_validation"
path = "examples/config_validation.rs"