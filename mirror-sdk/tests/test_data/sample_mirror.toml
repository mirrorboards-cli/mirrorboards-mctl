[[repositories]]
id = "repo1-id"
origin = "git@github.com:example/repo1.git"
branch = "main"
path = "example/repo1"
tags = ["example", "test"]

[[repositories]]
origin = "git@github.com:example/repo2.git"
branch = "develop"
branch-lock = true
path = "example/repo2"
tags = ["example", "locked"]

[[repositories]]
origin = "git@github.com:example/repo3.git"
branch = "feature/new-feature"
path = "example/repo3"