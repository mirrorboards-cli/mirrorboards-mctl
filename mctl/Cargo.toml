[package]
name = "mctl"
version = "0.1.0"
edition = "2021"
description = "Mirror Control CLI tool for managing mirror.toml files"
authors = ["MirrorBoards Team"]
license = "MIT"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "cargo", "env", "wrap_help", "unicode", "string"] }
# Terminal colors and formatting
colored = "2.0"
# Error handling
thiserror = "1.0"
# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Terminal interaction
dialoguer = "0.11"
# Table formatting
tabled = "0.14"
# Local mirror-sdk dependency
mirror-sdk = { path = "../mirror-sdk" }
# Logging
log = "0.4"
env_logger = "0.10"
# Path manipulation
dirs = "5.0"
# Terminal detection
atty = "0.2"
# Date and time
chrono = "0.4"
# Git operations
git2 = "0.18"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
