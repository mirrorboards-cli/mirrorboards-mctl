[package]
name = "mctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI tool for managing mirror.toml configuration files"
keywords = ["cli", "git", "mirror", "configuration", "toml"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mctl"
path = "src/main.rs"

[dependencies]
mirror-sdk = { path = "../mirror-sdk" }
anyhow.workspace = true
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
dialoguer = "0.11"
tabled = "0.15"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"