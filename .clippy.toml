# Clippy configuration for the Mirror Workspace
# See https://rust-lang.github.io/rust-clippy/master/index.html for all lints

# Allow certain lints that are too restrictive for this project
allow = [
    # Allow some complexity in the codebase
    "too_many_arguments",
    "too_many_lines",
]

# Warn on certain lints that are important for this project
warn = [
    # Correctness
    "clippy::all",
    "clippy::correctness",
    
    # Performance
    "clippy::performance",
    
    # Style
    "clippy::style",
    
    # Complexity
    "clippy::complexity",
    
    # Pedantic
    "clippy::pedantic",
    
    # Nursery (experimental lints)
    "clippy::nursery",
    
    # Cargo
    "clippy::cargo",
]

# Deny certain lints that are critical for this project
deny = [
    # Correctness
    "clippy::unwrap_used",
    "clippy::expect_used",
    "clippy::panic",
    "clippy::unreachable",
    "clippy::todo",
    
    # Documentation
    "clippy::missing_docs_in_private_items",
    "clippy::doc_markdown",
    
    # Error handling
    "clippy::result_unwrap_used",
    "clippy::option_unwrap_used",
    
    # Security
    "clippy::integer_arithmetic",
    "clippy::float_arithmetic",
]

# Configure specific lints
doc-valid-idents = ["MirrorSdk", "RepositoryBuilder", "MirrorConfig", "MirrorError"]