[package]
name = "mirror-cli"
version = "0.1.0"
edition = "2021"
authors = ["MirrorBoards Team"]
description = "CLI for managing mirror.toml files"
license = "MIT"
repository = "https://github.com/mirrorboards/mirror-sdk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Internal dependencies
mirror-sdk = { path = "../mirror-sdk" }

# Command-line parsing
clap = { version = "4.4", features = ["derive", "cargo"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Terminal output formatting
colored = "2.0"

# Logging
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"