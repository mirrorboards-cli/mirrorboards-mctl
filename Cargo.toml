[workspace]

[package]
name = "mctl"
version = "0.2.0"
edition = "2021"
description = "Mirror configuration management tool"
license = "MIT OR Apache-2.0"
authors = ["Mirrorboards Team"]
repository = "https://github.com/mirrorboards-rs/mctl"
keywords = ["git", "mirror", "configuration", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mctl"
path = "src/lib.rs"

[[bin]]
name = "mctl"
path = "src/main.rs"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
regex = "1.0"
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
serde_json = "1.0"
dialoguer = "0.11"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }

# TUI rendering
ratatui = "0.29"
crossterm = "0.28"

# Concurrency
rayon = "1.10"

[dependencies.tempfile]
version = "3.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
