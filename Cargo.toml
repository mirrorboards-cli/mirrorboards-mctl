[workspace]
members = [
    "mctl",
    "mirror-sdk"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["mctl contributors"]
repository = "https://github.com/mirrorboards/mctl"

[workspace.dependencies]
# Shared dependencies across workspace
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"