[package]
name = "mctl"
version = "0.1.0"
edition = "2024"
description = "CLI tool to clone repositories based on mirror.toml configuration"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
git2 = "0.18"
anyhow = "1.0"
thiserror = "1.0"
