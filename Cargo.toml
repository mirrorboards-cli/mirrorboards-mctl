[package]
name = "mctl"
version = "0.1.0"
edition = "2021"
description = "Mirror Control - A tool for git repository synchronization and mirroring"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.3", features = ["derive"] }
dirs = "5.0"
env_logger = "0.10"
git2 = "0.17"
log = "0.4"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
toml = "0.7"
url = "2.4"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
